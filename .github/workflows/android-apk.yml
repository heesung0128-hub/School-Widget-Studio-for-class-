name: Android Widget APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: school-widget-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to Release (easy download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 학교 생활 위젯 APK (자동 빌드 최신본)
          body: |
            태블릿에서 아래 `app-debug.apk` 파일을 다운로드한 뒤 열어서 설치하세요.
            "출처를 알 수 없는 앱" 설치 허용 팝업이 뜨면 허용해야 설치가 진행됩니다.

            커밋 ${{ github.sha }} 기준으로 자동 빌드되었습니다.
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
